<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Mestre Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        /* Default transition for theme switch */
        transition: background-color 0.3s, color 0.3s;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      /* Animation: Ball dropping from top with a bounce */
      @keyframes dropIn {
        0% { 
          transform: translateY(-300px) scale(0.5); 
          opacity: 0; 
        }
        60% { 
          transform: translateY(20px) scale(1.1); 
          opacity: 1; 
        }
        80% { 
          transform: translateY(-10px) scale(0.95); 
          opacity: 1; 
        }
        100% { 
          transform: translateY(0) scale(1); 
          opacity: 1; 
        }
      }
      .animate-drop {
        animation: dropIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.10.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "qrcode.react": "https://esm.sh/qrcode.react@^4.2.0"
  }
}
</script>
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">
    <div id="root"></div>
  </body>
</html>
