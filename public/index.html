<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo da Família</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
</head>
<body class="display-page">
  <header class="topbar">
    <h1>🎱 Bingo</h1>
    <div class="topbar-info">
      <span><strong id="drawn-count">0</strong> de 75 sorteados</span>
      <span id="connection" class="conn disconnected" title="Sem conexão"></span>
      <button id="btn-name" class="btn btn-ghost" type="button" title="Mudar o nome desta caixa de som">📍</button>
      <button id="btn-sound" class="btn btn-ghost" type="button">🔇 Som desligado</button>
      <button id="btn-fullscreen" class="btn btn-ghost" type="button">⛶ Tela cheia</button>
    </div>
  </header>

  <main class="display-main">
    <section class="now-panel">
      <p class="label">Último número</p>
      <div id="ball" class="ball empty"><span class="ball-number">–</span></div>
      <p class="label">Anteriores</p>
      <div id="recent" class="recent"></div>
    </section>

    <section id="board" class="board" aria-label="Números sorteados"></section>
  </main>

  <aside id="connect" class="connect-card" hidden>
    <img id="admin-qr" alt="QR code do controle">
    <div>
      <strong>Controle no celular</strong>
      <span id="admin-url"></span>
    </div>
  </aside>

  <div id="celebration" class="celebration" role="status" hidden>
    <div class="celebration-text" aria-label="Bingo!">
      <span class="l-B" style="--i: 0">B</span><span class="l-I" style="--i: 1">I</span><span class="l-N" style="--i: 2">N</span><span class="l-G" style="--i: 3">G</span><span class="l-O" style="--i: 4">O</span><span style="--i: 5">!</span>
    </div>
    <p class="celebration-sub">Temos vencedor! 🎉</p>
  </div>

  <div id="sound-overlay" class="overlay">
    <div class="overlay-card">
      <p class="overlay-emoji">🔊</p>
      <h2>Esta tela vai falar os números</h2>
      <p>Ligue a caixa de som neste aparelho e clique no botão abaixo.</p>
      <label class="overlay-name">Nome desta caixa
        <input id="device-name" type="text" maxlength="30" placeholder="Ex.: Sala, Varanda">
      </label>
      <button id="btn-enable-sound" class="btn btn-primary btn-big" type="button">Ativar som</button>
      <button id="btn-no-sound" class="btn btn-ghost" type="button">Só mostrar, sem som</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/display.js"></script>
</body>
</html>
