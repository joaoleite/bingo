<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo - Sala de Jogo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎱 Bingo</h1>
      <div id="connection-status" class="status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Desconectado</span>
      </div>
    </header>

    <main>
      <!-- Seleção de Sala -->
      <section id="room-selection" class="section">
        <h2>Escolha uma Sala</h2>
        <div class="room-grid" id="room-grid">
          <!-- Salas serão carregadas aqui -->
        </div>
      </section>

      <!-- Jogo -->
      <section id="game-area" class="section hidden">
        <div class="game-header">
          <button id="btn-back" class="btn btn-secondary">← Voltar</button>
          <h2 id="current-room-name">Sala</h2>
          <div class="room-info">
            <span id="drawn-count">0</span> números sorteados
          </div>
        </div>

        <div class="bingo-board" id="bingo-board">
          <!-- Grid 5x5 B-I-N-G-O -->
          <div class="bingo-header">
            <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
          </div>
          <div class="bingo-grid" id="bingo-grid">
            <!-- Números serão renderizados aqui -->
          </div>
        </div>

        <div class="current-number-display" id="current-number-display">
          <div class="current-number" id="current-number">-</div>
          <div class="current-label">Último número</div>
        </div>

        <div class="drawn-numbers-list" id="drawn-numbers-list">
          <h3>Sorteados</h3>
          <div class="numbers-grid" id="numbers-grid">
            <!-- Números sorteados aparecem aqui -->
          </div>
        </div>
      </section>

      <!-- Admin Panel -->
      <section id="admin-panel" class="section hidden">
        <h2>Painel Administrativo</h2>
        <div class="admin-login" id="admin-login">
          <input type="password" id="admin-password" placeholder="Senha admin">
          <button id="btn-login" class="btn btn-primary">Entrar</button>
        </div>
        <div id="admin-controls" class="hidden">
          <div class="admin-room-selector">
            <label>Sala:</label>
            <select id="admin-room-select"></select>
          </div>
          <div class="admin-actions">
            <button id="btn-draw" class="btn btn-primary btn-large">🎱 Sortear Número</button>
            <button id="btn-reset" class="btn btn-danger">Resetar Sala</button>
          </div>
          <div class="admin-options">
            <label>
              <input type="checkbox" id="show-all-toggle">
              Mostrar todos os números
            </label>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Bingo Client-Server v1.0.0</p>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
