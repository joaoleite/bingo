<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Controle do Bingo</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎱</text></svg>">
</head>
<body class="admin-page">
  <!-- Login -->
  <form id="login" class="login-card" autocomplete="on">
    <h1>🎱 Controle do Bingo</h1>
    <label>Usuário
      <input type="text" id="login-user" autocomplete="username" autocapitalize="none" required>
    </label>
    <label>Senha
      <input type="password" id="login-pass" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="error" hidden></p>
    <button class="btn btn-primary btn-big" type="submit">Entrar</button>
  </form>

  <!-- Controle -->
  <div id="controller" class="controller" hidden>
    <header class="admin-top">
      <span id="connection" class="conn disconnected"></span>
      <span><strong id="drawn-count">0</strong>/75</span>
      <span id="speakers" class="pill pill-warn">🔇 nenhuma caixa de som</span>
    </header>

    <section class="admin-now">
      <div id="ball" class="ball ball-small empty"><span class="ball-number">–</span></div>
      <div class="admin-now-actions">
        <button id="btn-repeat" class="btn" type="button">🔁 Repetir último</button>
        <button id="btn-undo" class="btn" type="button">↩️ Desfazer último</button>
      </div>
    </section>

    <button id="btn-draw" class="btn btn-primary btn-draw" type="button">🎲 Sortear número</button>

    <div class="admin-row">
      <button id="btn-recap" class="btn" type="button">📣 Falar todos os números</button>
      <button id="btn-stop" class="btn" type="button">⏹ Parar</button>
    </div>

    <p class="hint">Ou toque no número que saiu do globo. Tocar num número já marcado fala ele de novo.</p>

    <section id="pad" class="board pad" aria-label="Números"></section>

    <details class="settings">
      <summary>⚙️ Configurações</summary>
      <label class="select-row">
        <span>🗣️ Voz</span>
        <select id="opt-voice"></select>
      </label>
      <label class="switch-row">
        <input type="checkbox" id="opt-repeat" checked>
        <span>Falar cada número 2 vezes</span>
      </label>
      <label class="switch-row">
        <input type="checkbox" id="opt-local">
        <span>Tocar o som também neste celular<br><small>Use se a caixa de som estiver ligada no celular (bluetooth)</small></span>
      </label>
      <a id="display-link" class="btn" href="/" target="_blank">🖥️ Abrir a tela do bingo</a>
      <button id="btn-reset" class="btn btn-danger" type="button">🔄 Novo jogo (apagar números)</button>
      <button id="btn-logout" class="btn btn-ghost" type="button">Sair</button>
    </details>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
